  <circle cx="36" cy="168" r="6" fill="#E17055" stroke="#2D3436" stroke-width="2"/>
  <circle cx="34" cy="167" r="1.5" fill="#2D3436"/>
  <!-- title bar -->
  <rect x="36" y="210" width="184" height="28" rx="8" fill="#2D3436"/>
  <text x="128" y="230" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="url(#gold)">一分钟老板</text>
