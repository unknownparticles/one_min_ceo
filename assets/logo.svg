  </defs>
  <rect width="256" height="256" rx="36" fill="url(#sky)"/>
  <rect x="10" y="10" width="236" height="236" rx="28" fill="none" stroke="#FFD93D" stroke-width="8"/>
  <!-- city left -->
  <g fill="#2D3436" opacity="0.85">
    <rect x="28" y="88" width="22" height="70"/>
    <rect x="54" y="70" width="18" height="88"/>
    <rect x="36" y="100" width="6" height="6" fill="#FFE66D"/>
    <rect x="36" y="114" width="6" height="6" fill="#FFE66D"/>
    <rect x="58" y="84" width="6" height="6" fill="#74B9FF"/>
    <rect x="58" y="98" width="6" height="6" fill="#74B9FF"/>
