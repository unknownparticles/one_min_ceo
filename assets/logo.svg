  <!-- stars/rocket -->
  <circle cx="196" cy="48" r="2" fill="#FFF"/>
  <circle cx="214" cy="66" r="1.5" fill="#FFF"/>
  <circle cx="180" cy="72" r="1.5" fill="#FFF"/>
  <path d="M210 40 L222 70 L206 64 L198 78 Z" fill="#DFE6E9"/>
  <path d="M214 58 L226 62 L214 66" fill="#FF6B6B"/>
