<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-label="One Min CEO Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B3B2E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="475" fill="url(#bg)"/>
  <g opacity="0.25" fill="#22C55E">
    <circle cx="160" cy="90" r="70"/>
    <circle cx="980" cy="120" r="90"/>
    <circle cx="860" cy="380" r="60"/>
  </g>
  <text x="80" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="800" fill="#F8FAFC">一分钟老板</text>
  <text x="80" y="250" font-family="Courier New, monospace" font-size="28" fill="#86EFAC">60 秒像素人生 · 选择即蝴蝶效应</text>
  <text x="80" y="310" font-family="Courier New, monospace" font-size="20" fill="#94A3B8">对标 Reigns 资源拉扯 · 60 Seconds 真实倒计时 · 人生重开收集欲</text>
  <rect x="80" y="350" width="220" height="48" rx="12" fill="#F59E0B"/>
  <text x="190" y="382" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#111827">PLAY 60s</text>
  <!-- mini meter bars -->
  <g transform="translate(760,150)">
    <text x="0" y="0" font-family="monospace" font-size="18" fill="#F8FAFC">WEALTH</text>
    <rect x="0" y="12" width="280" height="16" rx="4" fill="#334155"/>
    <rect x="0" y="12" width="180" height="16" rx="4" fill="#F4D35E"/>
    <text x="0" y="56" font-family="monospace" font-size="18" fill="#F8FAFC">CHAOS</text>
    <rect x="0" y="68" width="280" height="16" rx="4" fill="#334155"/>
    <rect x="0" y="68" width="220" height="16" rx="4" fill="#FF6B6B"/>
    <text x="0" y="112" font-family="monospace" font-size="18" fill="#F8FAFC">SANITY</text>
    <rect x="0" y="124" width="280" height="16" rx="4" fill="#334155"/>
    <rect x="0" y="124" width="120" height="16" rx="4" fill="#6BCB77"/>
  </g>
</svg>
